[package]
name = "gnome-foreground-booster"
version = "0.1.0"
edition = "2024"
description = "Raises the CPU weight of the focused GNOME application through systemd and D-Bus"
license = "GPL-3.0-only"
repository = "https://github.com/luminusOS/gnome-foreground-booster"
rust-version = "1.85"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "rt", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
